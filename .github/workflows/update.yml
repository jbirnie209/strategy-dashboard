name: Update data and deploy

on:
  schedule:
    - cron: "30 22 * * 1-5"   # after the US close: new prices
    - cron: "30 13 * * 2-6"   # next morning: FRED publishes the prior day's yields and spreads
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test phone alert"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch latest data
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/update.py
      - name: Keep the previous data for alerts
        run: cp site/data.json "$RUNNER_TEMP/prev.json" || true
      - name: Run model and build data.json
        run: cd pipeline && python build.py
      - name: Phone alert on notable changes (opens an issue; the GitHub app notifies the owner)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          out="$RUNNER_TEMP/alert.md"
          python pipeline/alerts.py "$RUNNER_TEMP/prev.json" site/data.json "$out"
          if [ "$TEST_ALERT" = "true" ] && [ ! -f "$out" ]; then
            printf 'Test alert\n- Alerts are working. You will get one like this when the regime, target allocation or a volatility spike changes.\n' > "$out"
          fi
          if [ -f "$out" ]; then
            body="$(tail -n +2 "$out")"$'\n\n'"@${{ github.repository_owner }}"
            gh issue create -R "${{ github.repository }}" --title "$(head -1 "$out")" --body "$body"
          fi
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.json
          git diff --cached --quiet || (git commit -m "Data update $(date -u +%Y-%m-%d)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
